<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zebra Scanner v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#141414;color:#ddd;font-family:'Courier New',monospace;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-text-size-adjust:100%}
header{background:#0c0c0c;border-bottom:1px solid #252525;padding:8px 14px;
  display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-size:11px;letter-spacing:3px;color:#fff;text-transform:uppercase;flex:1}
.led{width:7px;height:7px;border-radius:50%;background:#aa0;box-shadow:0 0 5px #ff0;transition:all .3s;flex-shrink:0}
#logToggle{display:none;font-size:10px;padding:4px 10px}

.main{display:flex;flex:1;min-height:0;overflow:hidden}

.cs{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:10px;background:#1a1a1a;overflow:auto}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex-shrink:0}
button{background:#1e1e1e;color:#bbb;border:1px solid #3a3a3a;padding:9px 16px;
  font-family:inherit;font-size:11px;letter-spacing:1px;cursor:pointer;
  text-transform:uppercase;transition:all .12s}
button:hover{background:#2a2a2a;border-color:#666;color:#fff}
button:disabled{opacity:.4;cursor:default}
button.active{background:#800;border-color:#c00;color:#fff}

.views{display:flex;gap:10px;align-items:flex-start;justify-content:center;
  flex-wrap:wrap;width:100%;min-height:0}
#wrap,#warpWrap{position:relative;border:1px solid #2e2e2e;background:#000}
#mainCanvas{display:block;max-width:100%;height:auto;max-height:70vh}
#warpWrap{display:none}
#warpCanvas{display:block;width:150px;height:150px}
.vlabel{font-size:9px;color:#555;text-align:center;letter-spacing:1px;margin-top:3px}

#camWrap{display:none;position:relative;border:1px solid #2e2e2e;background:#000;max-width:100%}
#videoEl{display:block;max-width:100%;height:auto;max-height:70vh}
#camOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#camTimer{position:absolute;top:8px;right:12px;font-size:22px;font-weight:bold;
  color:#fff;text-shadow:0 0 8px #000}

#status{font-size:11px;color:#888;letter-spacing:1px;min-height:14px;
  text-align:center;flex-shrink:0}
#cvStatus{font-size:11px;color:#ffb74d;text-align:center;min-height:14px;flex-shrink:0}

.log-side{width:290px;flex-shrink:0;background:#0c0c0c;border-left:1px solid #252525;
  display:flex;flex-direction:column;overflow:hidden}
.log-head{background:#111;border-bottom:1px solid #252525;padding:7px 12px;
  font-size:10px;letter-spacing:2px;color:#444;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#clearBtn{font-size:10px;padding:2px 7px;letter-spacing:0}
#logBox{flex:1;overflow-y:auto;padding:8px 10px;font-size:10.5px;line-height:1.75;
  -webkit-overflow-scrolling:touch}
.ll{margin-bottom:1px;word-break:break-word}
.ok{color:#4caf50}.err{color:#ef5350}.inf{color:#7eb8f7}.warn{color:#ffb74d}.dim{color:#666}
.sep{color:#252525;border-top:1px solid #252525;margin:5px 0;font-size:8px}
#fileInput{display:none}

/* ── MOBILE / NARROW ─────────────────────────────────────────────────────── */
@media (max-width:820px){
  #logToggle{display:block}
  .main{flex-direction:column}
  .cs{flex:1;min-height:0;padding:8px}
  .views{gap:6px}
  #mainCanvas{max-height:58vh}
  #videoEl{max-height:58vh}
  #warpCanvas{width:96px;height:96px}
  .log-side{
    width:100%;border-left:none;border-top:1px solid #252525;
    height:34vh;flex-shrink:0;
  }
  .log-side.hidden{display:none}
  button{padding:10px 14px;font-size:11px}
}
@media (max-width:820px) and (orientation:landscape){
  .log-side{height:100%;width:240px;border-top:none;border-left:1px solid #252525}
  .main{flex-direction:row}
  #mainCanvas,#videoEl{max-height:76vh}
}
</style>
</head>
<body>
<header><div class="led" id="led"></div><h1>Zebra Scanner v5</h1><button id="logToggle">LOG</button></header>
<div class="main">
  <div class="cs">
    <div id="cvStatus">⏳ Завантаження OpenCV.js...</div>
    <div class="ctrl">
      <button id="btnGallery" disabled>📁 Галерея</button>
      <button id="btnCamera" disabled>📷 Камера</button>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div class="views">
      <div>
        <div id="wrap"><canvas id="mainCanvas"></canvas></div>
      </div>
      <div id="warpWrap">
        <canvas id="warpCanvas"></canvas>
        <div class="vlabel">вирівняно</div>
      </div>
    </div>
    <div id="camWrap">
      <video id="videoEl" autoplay playsinline muted></video>
      <canvas id="camOverlay"></canvas>
      <div id="camTimer"></div>
    </div>
    <div id="status">завантажую OpenCV...</div>
  </div>
  <div class="log-side">
    <div class="log-head"><span>LOG</span><button id="clearBtn">✕</button></div>
    <div id="logBox"></div>
  </div>
</div>
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onCvReady()"></script>
<script>
const logBox=document.getElementById('logBox');
function L(m,t='inf'){const d=document.createElement('div');d.className='ll '+t;
  d.textContent=`[${new Date().toLocaleTimeString('uk',{hour12:false})}] ${m}`;
  logBox.appendChild(d);logBox.scrollTop=logBox.scrollHeight;}
function Lsep(){const d=document.createElement('div');d.className='ll sep';d.textContent='─'.repeat(26);logBox.appendChild(d);}
document.getElementById('clearBtn').onclick=()=>logBox.innerHTML='';
document.getElementById('logToggle').onclick=()=>{
  document.querySelector('.log-side').classList.toggle('hidden');
};

const statusEl=document.getElementById('status'), led=document.getElementById('led');
const canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
const warpCanvas=document.getElementById('warpCanvas'), warpWrap=document.getElementById('warpWrap');

function setLed(s){
  const c={ok:['#0c0','#0f0'],err:['#c00','#f00'],warn:['#aa0','#ff0']}[s]||['#aa0','#ff0'];
  led.style.background=c[0];led.style.boxShadow='0 0 6px '+c[1];
}

function onCvReady(){
  document.getElementById('cvStatus').textContent='✅ OpenCV.js готовий';
  document.getElementById('btnGallery').disabled=false;
  document.getElementById('btnCamera').disabled=false;
  statusEl.textContent='готово';setLed('ok');
  L('OpenCV.js готовий','ok');
  L('v5: findContours → 4-кутник → перспектива → зебра');
  Lsep();
}

// ── GALLERY ───────────────────────────────────────────────────────────────────
document.getElementById('btnGallery').onclick=()=>{stopCamera();document.getElementById('fileInput').click();};
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  Lsep();L(`Файл: ${f.name}`);
  const img=new Image();
  img.onload=()=>{
    canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
    ctx.drawImage(img,0,0);
    L(`Розмір: ${img.naturalWidth}×${img.naturalHeight}px`);
    statusEl.textContent='Аналізую...';setLed('warn');
    warpWrap.style.display='none';
    setTimeout(()=>{
      const r=detect(canvas,true);
      if(r.found){
        drawResult(ctx,r);
        showWarp(r);
        statusEl.textContent=`✅ сітка ${r.gridN}×${r.gridN}`;
        setLed('ok');
      }else{
        statusEl.textContent='❌ Зебру не знайдено';setLed('err');
      }
      Lsep();
    },40);
  };
  img.src=URL.createObjectURL(f);
  document.getElementById('fileInput').value='';
};

// ── CAMERA ────────────────────────────────────────────────────────────────────
let stream=null,camTick=null,camCd=null,camSecs=5,camFound=false;
const videoEl=document.getElementById('videoEl'),camWrap=document.getElementById('camWrap');
const camOvl=document.getElementById('camOverlay'),camOvlCtx=camOvl.getContext('2d');
const wrap=document.getElementById('wrap'),camTimerEl=document.getElementById('camTimer');

document.getElementById('btnCamera').onclick=async()=>{
  if(stream){stopCamera();return;}
  Lsep();L('Запуск камери...');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});
    videoEl.srcObject=stream;await videoEl.play();
    document.querySelector('.views').style.display='none';warpWrap.style.display='none';
    camWrap.style.display='block';
    const b=document.getElementById('btnCamera');b.classList.add('active');b.textContent='⏹ Стоп';
    camFound=false;camSecs=5;camTimerEl.textContent=camSecs+'s';
    camTick=setInterval(()=>{
      const vw=videoEl.videoWidth,vh=videoEl.videoHeight;if(!vw||!vh)return;
      camOvl.width=vw;camOvl.height=vh;
      camOvlCtx.drawImage(videoEl,0,0,vw,vh);
      const r=detect(camOvl,false);
      if(r.found){
        camFound=true;
        drawResult(camOvlCtx,r);
        canvas.width=vw;canvas.height=vh;ctx.drawImage(camOvl,0,0);
        L(`Знайдено! сітка ${r.gridN}×${r.gridN}`,'ok');
        stopCamera('ok');
        showWarp(r);
      }
    },300);
    camCd=setInterval(()=>{
      camSecs--;camTimerEl.textContent=camSecs+'s';
      if(camSecs<=0){
        if(!camFound){L('Не знайдено за 5с','err');statusEl.textContent='❌ Не знайдено';setLed('err');}
        stopCamera();
      }
    },1000);
  }catch(e){L('Камера: '+e.message,'err');}
};
function stopCamera(s){
  clearInterval(camTick);camTick=null;clearInterval(camCd);camCd=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  camWrap.style.display='none';document.querySelector('.views').style.display='flex';
  const b=document.getElementById('btnCamera');b.classList.remove('active');b.textContent='📷 Камера';
  camTimerEl.textContent='';
  if(s==='ok'){statusEl.textContent='✅ Знайдено!';setLed('ok');}
}

// ══ DETECTION ═════════════════════════════════════════════════════════════════
const WARP=400;   // rectified size for analysis

function detect(srcCanvas, v){
  let src,gray,blur,bin,contours,hier;
  const mats=[];
  try{
    src=cv.imread(srcCanvas);mats.push(src);
    const W=src.cols,H=src.rows;
    if(v)L(`Вхід: ${W}×${H}`);

    gray=new cv.Mat();mats.push(gray);
    cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);

    blur=new cv.Mat();mats.push(blur);
    cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);

    // Adaptive threshold — robust to uneven lighting / screen photos
    bin=new cv.Mat();mats.push(bin);
    const blockSize = (Math.floor(Math.min(W,H)/20)*2+1);
    cv.adaptiveThreshold(blur,bin,255,cv.ADAPTIVE_THRESH_MEAN_C,cv.THRESH_BINARY_INV,
      Math.max(11,Math.min(151,blockSize)),7);
    if(v)L(`Бінаризація (block=${Math.max(11,Math.min(151,blockSize))}) ✓`);

    // ── STEP 1: find all contours ────────────────────────────────────────────
    contours=new cv.MatVector();mats.push(contours);
    hier=new cv.Mat();mats.push(hier);
    cv.findContours(bin,contours,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
    if(v)L(`Контурів знайдено: ${contours.size()}`);

    // ── STEP 2: keep 4-corner convex quads of reasonable size ────────────────
    const minArea = W*H*0.004;   // at least 0.4% of image
    const maxArea = W*H*0.98;
    const quads=[];

    for(let i=0;i<contours.size();i++){
      const cnt=contours.get(i);
      const area=cv.contourArea(cnt);
      if(area<minArea||area>maxArea){cnt.delete();continue;}

      const peri=cv.arcLength(cnt,true);
      const approx=new cv.Mat();
      cv.approxPolyDP(cnt,approx,0.04*peri,true);

      if(approx.rows===4 && cv.isContourConvex(approx)){
        const pts=[];
        for(let p=0;p<4;p++) pts.push({x:approx.data32S[p*2],y:approx.data32S[p*2+1]});
        const ord=orderCorners(pts);
        const sq=squareness(ord);
        if(sq>0.55) quads.push({pts:ord,area,sq});
      }
      approx.delete();cnt.delete();
    }

    if(v)L(`4-кутників (квадратних): ${quads.length}`);
    if(!quads.length){
      if(v)L('❌ Жодного квадратного контуру','err');
      return {found:false};
    }

    // ── STEP 3: test each quad — warp to square, check zebra ─────────────────
    quads.sort((a,b)=>b.area-a.area);
    const tested = quads.slice(0,25);
    if(v)L(`Перевіряю ${tested.length} кандидатів...`);

    let best=null;
    for(const q of tested){
      const res = analyseQuad(gray, q.pts);
      if(!res) continue;
      if(!best || res.score>best.score){
        best={...res, pts:q.pts, area:q.area, sqns:q.sq};
      }
    }

    if(!best){
      if(v)L('❌ Зебра-патерн не підтверджено в жодному','err');
      return {found:false};
    }

    if(v){
      L(`Найкращий: score=${best.score.toFixed(3)}`,'ok');
      L(`  чергувань по периметру: ${(best.altRatio*100).toFixed(0)}%`);
      L(`  клітинок по периметру: ${best.totalCells}`);
      L(`  внутрішня сітка: ${best.gridN}×${best.gridN}`,'ok');
      const p=best.pts;
      L(`Кути: (${p[0].x},${p[0].y}) (${p[1].x},${p[1].y})`,'dim');
      L(`      (${p[2].x},${p[2].y}) (${p[3].x},${p[3].y})`,'dim');
    }

    if(best.score < 0.35){
      if(v)L(`❌ Score ${best.score.toFixed(2)} нижче порогу 0.35`,'err');
      return {found:false};
    }

    return {
      found:true,
      corners:best.pts,
      gridN:best.gridN,
      totalCells:best.totalCells,
      score:best.score,
      srcCanvas
    };

  }catch(e){
    if(v)L('Помилка: '+e,'err');
    return {found:false};
  }finally{
    mats.forEach(m=>{try{m.delete();}catch(e){}});
  }
}

// ── Order corners: TL, TR, BR, BL ─────────────────────────────────────────────
function orderCorners(pts){
  const cx=pts.reduce((s,p)=>s+p.x,0)/4;
  const cy=pts.reduce((s,p)=>s+p.y,0)/4;
  const withAngle=pts.map(p=>({...p,a:Math.atan2(p.y-cy,p.x-cx)}));
  // sort clockwise starting from top-left (angle ~ -135°)
  withAngle.sort((a,b)=>a.a-b.a);
  // find index closest to -135deg (-3π/4)
  let startIdx=0,bestD=Infinity;
  withAngle.forEach((p,i)=>{
    let d=Math.abs(p.a-(-3*Math.PI/4));
    if(d>Math.PI) d=2*Math.PI-d;
    if(d<bestD){bestD=d;startIdx=i;}
  });
  const out=[];
  for(let i=0;i<4;i++) out.push(withAngle[(startIdx+i)%4]);
  return out.map(p=>({x:p.x,y:p.y}));
}

// ── Squareness: 0..1, how close the quad is to a square ───────────────────────
function squareness(p){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const sides=[d(p[0],p[1]),d(p[1],p[2]),d(p[2],p[3]),d(p[3],p[0])];
  const mn=Math.min(...sides), mx=Math.max(...sides);
  if(mx===0) return 0;
  const sideRatio=mn/mx;
  // diagonals should also be similar
  const d1=d(p[0],p[2]), d2=d(p[1],p[3]);
  const diagRatio=Math.min(d1,d2)/Math.max(d1,d2);
  return sideRatio*diagRatio;
}

// ── Warp a quad to WARP×WARP and analyse the zebra border ─────────────────────
let _warpCache=null;

function analyseQuad(gray, pts){
  let srcTri,dstTri,M,warped,wbin;
  try{
    srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[
      pts[0].x,pts[0].y, pts[1].x,pts[1].y, pts[2].x,pts[2].y, pts[3].x,pts[3].y
    ]);
    dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[
      0,0, WARP,0, WARP,WARP, 0,WARP
    ]);
    M=cv.getPerspectiveTransform(srcTri,dstTri);
    warped=new cv.Mat();
    cv.warpPerspective(gray,warped,M,new cv.Size(WARP,WARP),
      cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(127));

    // Otsu on the rectified patch — inside the code, lighting is uniform
    wbin=new cv.Mat();
    cv.threshold(warped,wbin,0,255,cv.THRESH_BINARY_INV|cv.THRESH_OTSU);

    const d=wbin.data;
    const px=(x,y)=>{
      x=Math.round(x);y=Math.round(y);
      if(x<0||x>=WARP||y<0||y>=WARP) return 0;
      return d[y*WARP+x]>0?1:0;
    };

    // The zebra ring may sit right at the edge, or a few px inside
    // (quad may be the black frame outline). Test several insets.
    let bestRing=null;
    for(const inset of [2,4,6,9,12,16,22,30]){
      const ring=readRing(px, inset);
      if(!ring) continue;
      if(!bestRing || ring.score>bestRing.score) bestRing={...ring, inset};
    }
    if(!bestRing) return null;

    // grid inside = total cells across minus the 2 border cells
    const gridN = Math.max(1, bestRing.totalCells - 2);

    // keep warped patch for preview
    _warpCache = {mat: warped.clone(), inset: bestRing.inset, totalCells: bestRing.totalCells};

    return {
      score: bestRing.score,
      altRatio: bestRing.altRatio,
      totalCells: bestRing.totalCells,
      gridN,
      inset: bestRing.inset
    };
  }catch(e){
    return null;
  }finally{
    [srcTri,dstTri,M,warped,wbin].forEach(m=>{try{if(m)m.delete();}catch(e){}});
  }
}

// ── Read the border ring at a given inset, measure zebra quality ──────────────
function readRing(px, inset){
  const a=inset, b=WARP-1-inset;
  if(b-a < 40) return null;

  // Sample the 4 sides
  const top=[],bottom=[],left=[],right=[];
  for(let x=a;x<=b;x++){ top.push(px(x,a)); bottom.push(px(x,b)); }
  for(let y=a;y<=b;y++){ left.push(px(a,y)); right.push(px(b,y)); }

  const sides=[top,bottom,left,right];

  // Alternation ratio: how often neighbouring samples differ
  let alt=0,tot=0;
  for(const s of sides){
    for(let i=0;i<s.length-1;i++){ if(s[i]!==s[i+1]) alt++; tot++; }
  }
  const altRatio = tot? alt/tot : 0;

  // Balance: zebra is ~50% dark
  let dark=0,cnt=0;
  for(const s of sides){ for(const v of s){ dark+=v; cnt++; } }
  const darkRatio = cnt? dark/cnt : 0;
  const balance = 1 - Math.abs(darkRatio-0.5)*2;   // 1 when exactly 50/50

  // Cell count per side via run lengths — all 4 sides must agree
  const counts = sides.map(s=>countCells(s)).filter(c=>c);
  if(counts.length<4) return null;

  const mn=Math.min(...counts), mx=Math.max(...counts);
  const agree = mx>0 ? mn/mx : 0;               // 1 when all sides give same count
  const totalCells = Math.round(counts.reduce((x,y)=>x+y,0)/counts.length);

  // Corners must be dark (black squares at all four corners)
  const cornersDark = [px(a+2,a+2),px(b-2,a+2),px(b-2,b-2),px(a+2,b-2)]
                        .reduce((s,v)=>s+v,0)/4;

  // Zebra must have a reasonable number of cells
  if(totalCells<6||totalCells>120) return null;

  // Combined score
  const score = altRatio*0.35 + balance*0.2 + agree*0.25 + cornersDark*0.2;

  return {score, altRatio, balance, agree, totalCells, cornersDark};
}

// ── Count cells along one side using run lengths ──────────────────────────────
function countCells(arr){
  const runs=[];
  let cur=arr[0],cnt=1;
  for(let i=1;i<arr.length;i++){
    if(arr[i]===cur) cnt++;
    else{runs.push(cnt);cur=arr[i];cnt=1;}
  }
  runs.push(cnt);
  if(runs.length<5) return null;

  // Drop first/last runs (edge artefacts), take median as unit cell size
  const inner=runs.slice(1,-1).filter(r=>r>=1);
  if(inner.length<3) return null;
  const sorted=[...inner].sort((a,b)=>a-b);
  const unit=sorted[Math.floor(sorted.length/2)];
  if(unit<2) return null;

  return Math.round(arr.length/unit);
}

// ══ DRAWING ═══════════════════════════════════════════════════════════════════
function drawResult(ctx, r){
  const p=r.corners;
  const N=r.totalCells;          // cells across the full code incl. border
  const gridN=r.gridN;

  // Bilinear interpolation across the quad: (u,v) in 0..1 → pixel
  const at=(u,v)=>{
    const topX=p[0].x+(p[1].x-p[0].x)*u, topY=p[0].y+(p[1].y-p[0].y)*u;
    const botX=p[3].x+(p[2].x-p[3].x)*u, botY=p[3].y+(p[2].y-p[3].y)*u;
    return {x:topX+(botX-topX)*v, y:topY+(botY-topY)*v};
  };

  // Outer quad outline
  ctx.save();
  ctx.strokeStyle='#ffd700';ctx.lineWidth=Math.max(1.5,ctx.canvas.width*0.002);
  ctx.setLineDash([6,4]);
  ctx.beginPath();
  ctx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<4;i++) ctx.lineTo(p[i].x,p[i].y);
  ctx.closePath();ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Inner grid region: skip 1 border cell on each side
  const m=1/N;                   // one cell in normalised coords
  const gs=(1-2*m)/gridN;        // grid step in normalised coords

  // Grid lines
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=Math.max(0.6,ctx.canvas.width*0.0008);
  for(let i=0;i<=gridN;i++){
    const t=m+gs*i;
    ctx.beginPath();
    let a=at(t,m),b=at(t,1-m);
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.beginPath();
    a=at(m,t);b=at(1-m,t);
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }

  // Dot at every cell centre
  const cellPx = Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)/N;
  const dotR   = Math.max(1, cellPx*0.16);
  ctx.fillStyle='rgba(255,255,255,0.75)';
  for(let row=0;row<gridN;row++){
    for(let col=0;col<gridN;col++){
      const c=at(m+gs*(col+0.5), m+gs*(row+0.5));
      ctx.beginPath();ctx.arc(c.x,c.y,dotR,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();

  // Red squares over the four corner cells
  ctx.save();
  ctx.globalAlpha=0.8;ctx.fillStyle='#cc0000';
  ctx.strokeStyle='#ff5050';ctx.lineWidth=Math.max(1,cellPx*0.12);
  const cornerCells=[[0,0],[N-1,0],[N-1,N-1],[0,N-1]];
  for(const [cx,cy] of cornerCells){
    const q=[
      at(cx/N,      cy/N),
      at((cx+1)/N,  cy/N),
      at((cx+1)/N,  (cy+1)/N),
      at(cx/N,      (cy+1)/N)
    ];
    ctx.beginPath();
    ctx.moveTo(q[0].x,q[0].y);
    for(let i=1;i<4;i++) ctx.lineTo(q[i].x,q[i].y);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha=1;ctx.stroke();ctx.globalAlpha=0.8;
  }
  ctx.restore();
}

// ── Show the rectified patch in the side preview ──────────────────────────────
function showWarp(r){
  if(!_warpCache) return;
  try{
    warpCanvas.width=WARP;warpCanvas.height=WARP;
    cv.imshow(warpCanvas,_warpCache.mat);
    warpWrap.style.display='block';
    _warpCache.mat.delete();
    _warpCache=null;
  }catch(e){}
}
